<svg fill="none" viewBox="0 0 800 220" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d12" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="45%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <!-- Glow Effects -->
    <radialGradient id="glow1" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="glow2" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="220" rx="14" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Radial Glow Accents -->
  <rect width="800" height="220" rx="14" fill="url(#glow1)"/>
  <rect width="800" height="220" rx="14" fill="url(#glow2)"/>

  <!-- Decorative Top Right Grid Dots -->
  <g fill="#30363d" opacity="0.4">
    <circle cx="720" cy="35" r="2"/>
    <circle cx="740" cy="35" r="2"/>
    <circle cx="760" cy="35" r="2"/>
    <circle cx="720" cy="50" r="2"/>
    <circle cx="740" cy="50" r="2"/>
    <circle cx="760" cy="50" r="2"/>
    <circle cx="720" cy="65" r="2"/>
    <circle cx="740" cy="65" r="2"/>
    <circle cx="760" cy="65" r="2"/>
  </g>

  <!-- Title Section -->
  <text x="45" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">Krishna Gupta</text>
  
  <!-- Subtitle -->
  <text x="45" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#8b949e">
    AI &amp; Data Science Engineer <tspan fill="#58a6ff">•</tspan> Machine Learning &amp; Deep Learning Specialist
  </text>

  <!-- Tag Pill 1: Artificial Intelligence -->
  <g transform="translate(45, 125)">
    <rect width="185" height="32" rx="16" fill="rgba(88, 166, 255, 0.1)" stroke="rgba(88, 166, 255, 0.3)" stroke-width="1"/>
    <text x="92" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#58a6ff">🤖 Artificial Intelligence</text>
  </g>

  <!-- Tag Pill 2: Deep Learning & NLP -->
  <g transform="translate(242, 125)">
    <rect width="175" height="32" rx="16" fill="rgba(188, 140, 255, 0.1)" stroke="rgba(188, 140, 255, 0.3)" stroke-width="1"/>
    <text x="87" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#bc8cff">🧠 Deep Learning &amp; NLP</text>
  </g>

  <!-- Tag Pill 3: Data Science & Analytics -->
  <g transform="translate(429, 125)">
    <rect width="185" height="32" rx="16" fill="rgba(63, 185, 80, 0.1)" stroke="rgba(63, 185, 80, 0.3)" stroke-width="1"/>
    <text x="92" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#3fb950">📊 Data Science &amp; Analytics</text>
  </g>

  <!-- Tag Pill 4: C++ & Python Developer -->
  <g transform="translate(626, 125)">
    <rect width="140" height="32" rx="16" fill="rgba(255, 166, 87, 0.1)" stroke="rgba(255, 166, 87, 0.3)" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#ffa657">⚡ C++ &amp; Python</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="45" y="180" width="710" height="1" fill="#30363d"/>
  <rect x="45" y="180" width="120" height="2" fill="#58a6ff"/>
</svg>
